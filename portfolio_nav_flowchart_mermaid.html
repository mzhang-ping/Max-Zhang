
<div id="chart" style="padding:1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  flowchart: { curve: 'monotoneY', padding: 20, nodeSpacing: 50, rankSpacing: 60 },
  themeVariables: {
    darkMode: dark,
    fontSize: '14px',
    fontFamily: '"Anthropic Sans", sans-serif',
    primaryColor:       dark ? '#1B2D45' : '#E6F1FB',
    primaryTextColor:   dark ? '#B5D4F4' : '#0C447C',
    primaryBorderColor: dark ? '#378ADD' : '#185FA5',
    lineColor:          dark ? '#378ADD' : '#185FA5',
    secondaryColor:     dark ? '#0F2E1E' : '#E1F5EE',
    secondaryTextColor: dark ? '#9FE1CB' : '#085041',
    secondaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    tertiaryColor:      dark ? '#2C1F0A' : '#FAEEDA',
    tertiaryTextColor:  dark ? '#FAC775' : '#633806',
    tertiaryBorderColor:dark ? '#BA7517' : '#854F0B',
    noteBkgColor:       dark ? '#1a1a1a' : '#f9f9f9',
    noteTextColor:      dark ? '#c2c0b6' : '#3d3d3a',
    edgeLabelBackground:dark ? '#1a1a1a' : '#ffffff',
    clusterBkg:         dark ? '#111a24' : '#f0f6ff',
    clusterBorder:      dark ? '#378ADD' : '#185FA5',
  },
});

const diagram = `flowchart TD
    A([Visitor arrives]):::entry --> B

    B["🏠 Home / Landing page\n─────────────────\nName · tagline · quick-nav cards"]:::home

    B --> C{Which page?}:::decision

    C -->|about| D["About Me\n─────────\nStory · goals\nbackground"]:::page
    C -->|resume| E["Resume\n─────────\nEducation\nachievements"]:::page
    C -->|skills| F["Skills\n─────────\nTech · academic\nsoft skills"]:::page
    C -->|projects| G["Projects\n─────────\nCAD work\nengineering"]:::page
    C -->|contact| H["Contact\n─────────\nForm · email\nLinkedIn"]:::page

    D --> D1["Interests & passions\nEngineering love story\nCareer goals"]:::sub
    E --> E1["OnShape certification\nRocketry Club\nAdvanced math"]:::sub
    F --> F1["CAD / OnShape\nCalculus & physics\nTeamwork"]:::sub
    G --> G1["CAD model renders\nRocketry project\nMath study"]:::sub
    H --> H1["Submit form"]:::action

    H1 --> H2([Confirmation sent]):::success

    D1 & E1 & F1 & G1 --> NAV
    NAV["↻ Persistent nav bar — return to any page"]:::nav
    NAV --> B

    classDef entry    fill:#0F2E1E,stroke:#1D9E75,color:#9FE1CB,rx:20
    classDef home     fill:#1B2D45,stroke:#378ADD,color:#B5D4F4,font-weight:bold
    classDef decision fill:#2C1F0A,stroke:#BA7517,color:#FAC775
    classDef page     fill:#1B2D45,stroke:#378ADD,color:#B5D4F4
    classDef sub      fill:#111a24,stroke:#334455,color:#8a9bb0,font-size:12px
    classDef action   fill:#1B2D45,stroke:#378ADD,color:#B5D4F4
    classDef success  fill:#0F2E1E,stroke:#1D9E75,color:#9FE1CB
    classDef nav      fill:#2C1F0A,stroke:#BA7517,color:#FAC775,font-style:italic
`;

const { svg } = await mermaid.render('flow-svg', diagram);
document.getElementById('chart').innerHTML = svg;
document.querySelector('#chart svg').style.width = '100%';
document.querySelector('#chart svg').style.maxWidth = '100%';
</script>
